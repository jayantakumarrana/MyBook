<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whispers of the Heart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="room-light"></div>
  <div class="dust"></div>

  <main>
    <!-- FRONT COVER -->
    <section id="coverScreen" class="screen">
      <div class="luxury-book closed-book" onclick="openBook()" tabindex="0" role="button" aria-label="Open book">
        <div class="cover-shadow"></div>
        <div class="back-board"></div>
        <div class="front-board">
          <div class="cover-grain"></div>
          <div class="gold-corner top-left"></div>
          <div class="gold-corner top-right"></div>
          <div class="gold-corner bottom-left"></div>
          <div class="gold-corner bottom-right"></div>

          <div class="cover-frame">
            <div class="mini-ornament">✦</div>
            <div class="edition">THE PRIVATE EDITION</div>
            <h1>Whispers<br><span>of the Heart</span></h1>
            <div class="gold-rule"></div>
            <p>A Journey Through Heart</p>
            <div class="medallion"><img src="images/heart-pulse.svg" alt="Pulsing red heart with an ECG line"></div>
          </div>
        </div>
        <div class="page-block-edge"></div>
        <div class="spine"></div>
      </div>
    </section>

    <!-- OPEN BOOK -->
    <section id="bookScreen" class="screen hidden">
      <div class="topbar">
        <span id="readingStatus">Introduction</span>
      </div>

      <div class="book-stage">
        <div class="desk-shadow"></div>
        <div class="open-book" id="book">
          <div class="leather-underlay"></div>
          <button class="song-toggle" id="songToggle" type="button" disabled aria-pressed="false" aria-label="No song on this page" title="No song on this page"></button>

          <div class="page left-page" id="leftPage"></div>
          <div class="page right-page" id="rightPage"></div>

          <div class="paper-stack left-stack"></div>
          <div class="paper-stack right-stack"></div>

          <div class="turn-sheet hidden" id="turnSheet">
            <div class="sheet-face front" id="turnFront"></div>
            <div class="sheet-face back" id="turnBack"></div>
          </div>

          <div class="gutter"></div>
          <div class="bookmark"></div>
        </div>
      </div>

      <div class="controls">
        <div class="progress">
          <span id="progressText">Introduction</span>
          <div class="progress-track"><span id="progressBar"></span></div>
        </div>
      </div>
    </section>

    <!-- BACK COVER -->
    <section id="backScreen" class="screen hidden" onclick="readAgain()" tabindex="0" role="button" aria-label="Read the book again">
      <div class="luxury-book back-cover">
        <div class="back-board">
          <div class="cover-frame back-frame">
            <div class="mini-ornament">✦</div>
            <h2>Whispers<br>of the Heart</h2>
            <div class="gold-rule"></div>
            <p>Every page holds a memory.<br>Every poem carries a feeling.</p>
            <div class="medallion"><img src="images/heart-pulse.svg" alt="Pulsing red heart with an ECG line"></div>
          </div>
        </div>
        <div class="spine back-spine"></div>
      </div>
    </section>
  </main>

  <audio id="pageAudio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
